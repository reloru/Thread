<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
	<title>Thread</title>
	<meta name="description" content="AI chat on Cloudflare Workers AI">
	<meta name="color-scheme" content="light dark">
	<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
	<meta name="theme-color" content="#0e0e11" media="(prefers-color-scheme: dark)">
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-title" content="Thread">
	<meta name="apple-mobile-web-app-status-bar-style" content="default">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
	<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
	<link rel="stylesheet" href="/style.css">
	<script type="module" src="/app.js"></script>
</head>
<body>
	<svg class="sprite" aria-hidden="true">
		<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
		<symbol id="i-new" viewBox="0 0 24 24"><path d="M12 5H6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2v-6"/><path d="M17.6 3.6a2 2 0 0 1 2.8 2.8L12 14.8l-3.6.8.8-3.6z"/></symbol>
		<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
		<symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6"/></symbol>
		<symbol id="i-down" viewBox="0 0 24 24"><path d="M12 5v14M6 13l6 6 6-6"/></symbol>
		<symbol id="i-stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2"/></symbol>
		<symbol id="i-chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></symbol>
		<symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/></symbol>
		<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
		<symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></symbol>
		<symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
		<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
		<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
		<symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></symbol>
		<symbol id="i-gear" viewBox="0 0 24 24"><path d="M18.84 10.50 L21.13 10.85 L21.13 13.15 L18.84 13.50 L17.90 15.77 L19.27 17.64 L17.64 19.27 L15.77 17.90 L13.50 18.84 L13.15 21.13 L10.85 21.13 L10.50 18.84 L8.23 17.90 L6.36 19.27 L4.73 17.64 L6.10 15.77 L5.16 13.50 L2.87 13.15 L2.87 10.85 L5.16 10.50 L6.10 8.23 L4.73 6.36 L6.36 4.73 L8.23 6.10 L10.50 5.16 L10.85 2.87 L13.15 2.87 L13.50 5.16 L15.77 6.10 L17.64 4.73 L19.27 6.36 L17.90 8.23Z"/><circle cx="12" cy="12" r="3"/></symbol>
		<symbol id="i-code" viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></symbol>
		<symbol id="i-globe" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"/></symbol>
		<symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
		<symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
		<symbol id="i-wave" viewBox="0 0 24 24"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></symbol>
		<symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
		<symbol id="i-mic-off" viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M9 9v2a3 3 0 0 0 5 2.2M15 9.3V6a3 3 0 0 0-5.7-1.3"/><path d="M5 11a7 7 0 0 0 11.2 5.6M19 11a7 7 0 0 1-.6 2.8M12 18v3"/></symbol>
		<symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5l11 7-11 7z"/></symbol>
		<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 16v-5a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2 2 0 0 0 4 0"/></symbol>
		<symbol id="i-logo" viewBox="0 0 64 64"><path d="M14 30c0-10 8-17 18-17s18 7 18 17-8 17-18 17c-2.6 0-5-.4-7.2-1.3L15 50l2.6-8.4C15.3 38.8 14 34.6 14 30z"/><path d="M23 27c4-4 7 4 11 0s7 4 10 1M23 34c4-4 7 4 11 0"/></symbol>
	</svg>

	<div id="app">
		<header class="topbar">
			<button type="button" class="icon-btn" id="menuBtn" aria-label="Chats"><svg><use href="#i-menu"/></svg></button>
			<div class="brand">Thread</div>
			<button type="button" class="model-pill" id="modelBtn" aria-haspopup="dialog">
				<span id="modelName">Model</span><svg><use href="#i-chev"/></svg>
			</button>
			<button type="button" class="icon-btn" id="newBtn" aria-label="New chat"><svg><use href="#i-new"/></svg></button>
		</header>

		<main id="scroller">
			<div id="empty" class="empty">
				<svg class="empty-logo"><use href="#i-logo"/></svg>
				<p>What's on your mind?</p>
			</div>
			<div id="messages"></div>
		</main>

		<footer class="composer">
			<button type="button" class="to-bottom" id="toBottom" aria-label="Scroll to latest"><svg><use href="#i-down"/></svg></button>
			<div class="notice" id="notice" hidden></div>
			<div class="notify-card" id="notifyCard" role="region" aria-label="Notifications" hidden>
				<svg><use href="#i-bell"/></svg>
				<p><b>Turn on notifications?</b> Thread will tell you when someone starts guessing the passcode, and anything else worth a ping.</p>
				<div class="notify-actions">
					<button type="button" class="text-link" id="notifyLater">Not now</button>
					<button type="button" class="notify-allow" id="notifyAllow">Allow</button>
				</div>
			</div>
			<div class="tool-chips" id="toolChips">
				<button type="button" class="chip" data-tool="python" aria-pressed="false"><svg><use href="#i-code"/></svg>Code</button>
				<button type="button" class="chip" data-tool="web" aria-pressed="false"><svg><use href="#i-globe"/></svg>Web</button>
				<button type="button" class="usage" id="usage" hidden></button>
			</div>
			<div class="attachments" id="attachments"></div>
			<form class="composer-box" id="form">
				<button type="button" class="icon-btn attach" id="attachBtn" aria-label="Attach image"><svg><use href="#i-plus"/></svg></button>
				<textarea id="input" rows="1" placeholder="Message" enterkeyhint="send" autocomplete="off"></textarea>
				<button type="button" class="icon-btn voice-btn" id="voiceBtn" aria-label="Voice chat"><svg><use href="#i-wave"/></svg></button>
				<button type="submit" class="send" id="sendBtn" aria-label="Send" disabled><svg><use href="#i-up"/></svg></button>
			</form>
			<input type="file" id="file" accept="image/*,.csv,.docx,.et,.htm,.html,.numbers,.odp,.ods,.odt,.otp,.pdf,.potx,.ppsm,.ppsx,.pptm,.pptx,.xls,.xlsb,.xlsm,.xlsx,.xml" multiple hidden>
		</footer>
	</div>

	<div class="scrim" id="scrim" hidden></div>

	<aside class="drawer" id="drawer" aria-label="Chats" inert>
		<div class="drawer-head">
			<svg class="drawer-logo"><use href="#i-logo"/></svg>
			<span>Thread</span>
			<button type="button" class="icon-btn" id="drawerNew" aria-label="New chat"><svg><use href="#i-new"/></svg></button>
		</div>
		<nav class="chat-list" id="chatList"></nav>
		<div class="drawer-foot">
			<button type="button" class="text-btn" id="lockBtn"><svg><use href="#i-lock"/></svg>Lock</button>
		</div>
	</aside>

	<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Choose model" inert>
		<div class="sheet-grip"></div>
		<div class="sheet-head">
			<div class="sheet-title">Model</div>
			<button type="button" class="icon-btn" id="settingsBtn" aria-label="Model settings"><svg><use href="#i-gear"/></svg></button>
		</div>
		<div class="model-list" id="modelList"></div>
		<p class="sheet-note">Prices per million tokens, input / output.</p>
	</div>

	<div class="settings" id="settings" role="dialog" aria-modal="true" aria-labelledby="settingsTitle" inert>
		<header class="settings-head">
			<button type="button" class="icon-btn" id="settingsBack" aria-label="Back to models"><svg><use href="#i-back"/></svg></button>
			<div class="settings-title">
				<span id="settingsTitle">Model</span>
				<small>Settings</small>
			</div>
			<button type="button" class="text-link" id="settingsReset">Reset</button>
		</header>
		<div class="settings-body" id="settingsBody"></div>
	</div>

	<div class="voice" id="voice" role="dialog" aria-modal="true" aria-label="Voice chat" inert>
		<header class="voice-head">
			<button type="button" class="icon-btn" id="voiceClose" aria-label="End voice chat"><svg><use href="#i-x"/></svg></button>
			<div class="voice-title">
				<span>Voice</span>
				<small id="voiceModel"></small>
			</div>
			<button type="button" class="model-pill" id="voiceChip" aria-haspopup="dialog" aria-label="Choose voice">
				<span id="voiceChipName">Voice</span><svg><use href="#i-chev"/></svg>
			</button>
		</header>
		<div class="voice-stage">
			<button type="button" class="voice-orb" id="voiceOrb" data-state="starting" aria-label="Voice level"></button>
			<div class="voice-state" id="voiceState" role="status">Starting…</div>
			<p class="voice-hint" id="voiceHint"></p>
			<div class="voice-caption" id="voiceCaption">
				<p class="voice-user" id="voiceUser"></p>
				<p class="voice-reply" id="voiceReply"></p>
			</div>
		</div>
		<footer class="voice-foot">
			<div class="segmented" id="voiceModes" role="radiogroup" aria-label="Turn-taking">
				<button type="button" class="seg" role="radio" data-mode="hands-free" aria-checked="true">Hands-free</button>
				<button type="button" class="seg" role="radio" data-mode="ptt" aria-checked="false">Tap to talk</button>
			</div>
			<button type="button" class="voice-mute" id="voiceMute" aria-pressed="false"><svg><use href="#i-mic"/></svg><span>Mute</span></button>
		</footer>
		<div class="voice-scrim" id="voiceScrim" hidden></div>
		<div class="sheet voice-sheet" id="voiceSheet" role="dialog" aria-modal="true" aria-label="Choose voice" inert>
			<div class="sheet-grip"></div>
			<div class="sheet-head">
				<div class="sheet-title">Voice</div>
				<button type="button" class="icon-btn" id="voiceSheetClose" aria-label="Close"><svg><use href="#i-x"/></svg></button>
			</div>
			<button type="button" class="switch-row" id="voiceTalkOver" role="switch" aria-checked="true">
				<span class="switch-text"><b>Talk over replies</b><small>Speak to interrupt. If the speaker sets off the microphone, turn this off and tap the orb to interrupt.</small></span>
				<i class="switch" aria-hidden="true"></i>
			</button>
			<div class="segmented" id="voiceFilter" role="radiogroup" aria-label="Language"></div>
			<div class="voice-list" id="voiceList"></div>
			<p class="sheet-note">Each preview costs about a tenth of a cent.</p>
		</div>
	</div>

	<div class="lock" id="lock" hidden>
		<form class="lock-card" id="lockForm">
			<svg class="lock-logo"><use href="#i-logo"/></svg>
			<h1>Thread</h1>
			<input type="text" name="username" value="thread" autocomplete="username" hidden>
			<div class="pass-field">
				<input type="password" id="passInput" placeholder="Passcode" autocomplete="current-password" autocapitalize="off" spellcheck="false" required>
				<button type="button" class="icon-btn" id="passToggle" aria-label="Show passcode"><svg><use href="#i-eye"/></svg></button>
			</div>
			<button type="submit" class="primary" id="unlockBtn">Unlock</button>
			<p class="lock-error" id="lockError" role="alert"></p>
		</form>
	</div>

	<div class="toast" id="toast" role="status" hidden></div>
	<div class="sr-only" id="announce" role="status"></div>
</body>
</html>
