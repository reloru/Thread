name: Codespaces probe
on:
  push:
    branches: [codespaces-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List Codespaces machine types with GH_TOKEN
        env:
          TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          curl -sS -D - -o /dev/null -H "Authorization: Bearer $TOKEN" https://api.github.com/user | grep -i -E '^(HTTP|x-oauth-scopes)'
          curl -sS -H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/reloru/Thread/codespaces/machines \
            | jq -r 'if .machines then (.machines[] | "\(.name)  \(.display_name)  cpus=\(.cpus)  mem=\(.memory_in_bytes/1073741824)GB  disk=\(.storage_in_bytes/1073741824)GB") else . end'
